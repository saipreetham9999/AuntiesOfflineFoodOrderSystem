# Stripe Configuration
stripe.api.key=sk_test_your_secret_key

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.stripeService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.stripeService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.stripeService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.stripeService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.stripeService.waitDurationInOpenState=10s

# Resilience4j Retry Configuration
resilience4j.retry.instances.stripeService.maxAttempts=3
resilience4j.retry.instances.stripeService.waitDuration=2s
