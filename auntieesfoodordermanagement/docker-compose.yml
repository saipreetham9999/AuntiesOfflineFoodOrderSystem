version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: auntiees-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 'your_root_password'
      MARIADB_DATABASE: 'auntiees_db'
      MARIADB_USER: 'user'
      MARIADB_PASSWORD: 'password'
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:6.2-alpine
    container_name: auntiees-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: auntiees-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"  # For application connection
      - "15672:15672" # For web management UI
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mariadb_data:
  redis_data:
  rabbitmq_data:
